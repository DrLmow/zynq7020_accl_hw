[project]
name = "zynq-handwritten-digits"
version = "0.1.0"
description = "MNIST handwritten digit CNN reference model for the Zynq project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
